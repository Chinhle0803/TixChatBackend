services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tixchat-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_USERS_TABLE=${DYNAMODB_USERS_TABLE}
      - DYNAMODB_CONVERSATIONS_TABLE=${DYNAMODB_CONVERSATIONS_TABLE}
      - DYNAMODB_MESSAGES_TABLE=${DYNAMODB_MESSAGES_TABLE}
      - DYNAMODB_PARTICIPANTS_TABLE=${DYNAMODB_PARTICIPANTS_TABLE}
      - DYNAMODB_CALL_SESSIONS_TABLE=${DYNAMODB_CALL_SESSIONS_TABLE}
      - DYNAMODB_NOTIFICATION_TOKENS_TABLE=${DYNAMODB_NOTIFICATION_TOKENS_TABLE}
      - DYNAMODB_POSTS_TABLE=${DYNAMODB_POSTS_TABLE}
      - DYNAMODB_COMMENTS_TABLE=${DYNAMODB_COMMENTS_TABLE}
      - DYNAMODB_URBAN_STATS_TABLE=${DYNAMODB_URBAN_STATS_TABLE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-30d}
      - AWS_SES_REGION=${AWS_SES_REGION}
      - AWS_SES_SENDER_EMAIL=${AWS_SES_SENDER_EMAIL}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_AVATAR_FOLDER=${S3_AVATAR_FOLDER}
      - S3_MESSAGE_FOLDER=${S3_MESSAGE_FOLDER}
      - S3_POST_IMAGES_BUCKET=${S3_POST_IMAGES_BUCKET}
      - S3_POST_IMAGES_FOLDER=${S3_POST_IMAGES_FOLDER}
      - AWS_LOCATION_REGION=${AWS_LOCATION_REGION}
      - AWS_LOCATION_STYLE=${AWS_LOCATION_STYLE}
      - AWS_LOCATION_COLOR_SCHEME=${AWS_LOCATION_COLOR_SCHEME}
      - AWS_LOCATION_VARIANT=${AWS_LOCATION_VARIANT}
      - AWS_LOCATION_ALLOWED_IPS=${AWS_LOCATION_ALLOWED_IPS}
      - AWS_CHIME_REGION=${AWS_CHIME_REGION}
      - CHIME_MEETING_REGION=${CHIME_MEETING_REGION}
      - CALL_RING_TIMEOUT_SECONDS=${CALL_RING_TIMEOUT_SECONDS:-60}
      - FRONTEND_URLS=${FRONTEND_URLS}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - AWS_BEDROCK_REGION=${AWS_BEDROCK_REGION}
      - AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID}
      - AWS_GEO_PLACES_REGION=${AWS_GEO_PLACES_REGION}
      - AWS_GEO_ROUTES_REGION=${AWS_GEO_ROUTES_REGION}
      - AWS_GEO_ROUTE_MODE=${AWS_GEO_ROUTE_MODE}
      - AI_MAX_CONTEXT_POSTS=${AI_MAX_CONTEXT_POSTS:-5}
      - AI_DEFAULT_RADIUS_KM=${AI_DEFAULT_RADIUS_KM:-5}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-12000}
      - ASSISTANT_ROUTE_SAMPLE_METERS=${ASSISTANT_ROUTE_SAMPLE_METERS:-150}
      - ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS=${ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS:-300}
      - ASSISTANT_MEMORY_TTL_SECONDS=${ASSISTANT_MEMORY_TTL_SECONDS:-1800}
      - ASSISTANT_MAX_TOOL_STEPS=${ASSISTANT_MAX_TOOL_STEPS:-6}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OPENSEARCH_VECTOR_ENDPOINT=${OPENSEARCH_VECTOR_ENDPOINT}
      - REDIS_URL=${REDIS_URL_DOCKER:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-tixchat}
      - REDIS_CONNECT_TIMEOUT_MS=${REDIS_CONNECT_TIMEOUT_MS:-1500}
      - REDIS_DEFAULT_TTL_SECONDS=${REDIS_DEFAULT_TTL_SECONDS:-60}
      - REDIS_POST_TTL_SECONDS=${REDIS_POST_TTL_SECONDS:-30}
      - REDIS_USER_TTL_SECONDS=${REDIS_USER_TTL_SECONDS:-120}
    networks:
      - tixchat-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tixchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tixchat-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  tixchat-network:
    driver: bridge

volumes:
  redis_data:
