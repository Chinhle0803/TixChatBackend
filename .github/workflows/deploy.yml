name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy on EC2
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      PORT: ${{ vars.PORT }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_URLS: ${{ vars.FRONTEND_URLS }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DYNAMODB_USERS_TABLE: ${{ vars.DYNAMODB_USERS_TABLE }}
      DYNAMODB_CONVERSATIONS_TABLE: ${{ vars.DYNAMODB_CONVERSATIONS_TABLE }}
      DYNAMODB_MESSAGES_TABLE: ${{ vars.DYNAMODB_MESSAGES_TABLE }}
      DYNAMODB_PARTICIPANTS_TABLE: ${{ vars.DYNAMODB_PARTICIPANTS_TABLE }}
      DYNAMODB_CALL_SESSIONS_TABLE: ${{ vars.DYNAMODB_CALL_SESSIONS_TABLE }}
      DYNAMODB_NOTIFICATION_TOKENS_TABLE: ${{ vars.DYNAMODB_NOTIFICATION_TOKENS_TABLE }}
      DYNAMODB_POSTS_TABLE: ${{ vars.DYNAMODB_POSTS_TABLE }}
      DYNAMODB_COMMENTS_TABLE: ${{ vars.DYNAMODB_COMMENTS_TABLE }}
      DYNAMODB_URBAN_STATS_TABLE: ${{ vars.DYNAMODB_URBAN_STATS_TABLE }}
      JWT_EXPIRE: ${{ vars.JWT_EXPIRE }}
      JWT_REFRESH_EXPIRE: ${{ vars.JWT_REFRESH_EXPIRE }}
      AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
      AWS_S3_REGION: ${{ vars.AWS_S3_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      S3_AVATAR_FOLDER: ${{ vars.S3_AVATAR_FOLDER }}
      S3_MESSAGE_FOLDER: ${{ vars.S3_MESSAGE_FOLDER }}
      S3_POST_IMAGES_BUCKET: ${{ vars.S3_POST_IMAGES_BUCKET }}
      S3_POST_IMAGES_FOLDER: ${{ vars.S3_POST_IMAGES_FOLDER }}
      AWS_LOCATION_REGION: ${{ vars.AWS_LOCATION_REGION }}
      AWS_LOCATION_STYLE: ${{ vars.AWS_LOCATION_STYLE }}
      AWS_LOCATION_COLOR_SCHEME: ${{ vars.AWS_LOCATION_COLOR_SCHEME }}
      AWS_LOCATION_VARIANT: ${{ vars.AWS_LOCATION_VARIANT }}
      AWS_LOCATION_ALLOWED_IPS: ${{ vars.AWS_LOCATION_ALLOWED_IPS }}
      AWS_CHIME_REGION: ${{ vars.AWS_CHIME_REGION }}
      CHIME_MEETING_REGION: ${{ vars.CHIME_MEETING_REGION }}
      CALL_RING_TIMEOUT_SECONDS: ${{ vars.CALL_RING_TIMEOUT_SECONDS }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AWS_BEDROCK_REGION: ${{ vars.AWS_BEDROCK_REGION }}
      AWS_BEDROCK_MODEL_ID: ${{ vars.AWS_BEDROCK_MODEL_ID }}
      AWS_GEO_PLACES_REGION: ${{ vars.AWS_GEO_PLACES_REGION }}
      AWS_GEO_ROUTES_REGION: ${{ vars.AWS_GEO_ROUTES_REGION }}
      AWS_GEO_ROUTE_MODE: ${{ vars.AWS_GEO_ROUTE_MODE }}
      AI_MAX_CONTEXT_POSTS: ${{ vars.AI_MAX_CONTEXT_POSTS }}
      AI_DEFAULT_RADIUS_KM: ${{ vars.AI_DEFAULT_RADIUS_KM }}
      AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
      ASSISTANT_ROUTE_SAMPLE_METERS: ${{ vars.ASSISTANT_ROUTE_SAMPLE_METERS }}
      ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS: ${{ vars.ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS }}
      ASSISTANT_MEMORY_TTL_SECONDS: ${{ vars.ASSISTANT_MEMORY_TTL_SECONDS }}
      ASSISTANT_MAX_TOOL_STEPS: ${{ vars.ASSISTANT_MAX_TOOL_STEPS }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      OPENSEARCH_VECTOR_ENDPOINT: ${{ vars.OPENSEARCH_VECTOR_ENDPOINT }}
      REDIS_ENABLED: ${{ vars.REDIS_ENABLED }}
      REDIS_URL: ${{ vars.REDIS_URL }}
      REDIS_URL_DOCKER: ${{ vars.REDIS_URL_DOCKER }}
      REDIS_KEY_PREFIX: ${{ vars.REDIS_KEY_PREFIX }}
      REDIS_CONNECT_TIMEOUT_MS: ${{ vars.REDIS_CONNECT_TIMEOUT_MS }}
      REDIS_DEFAULT_TTL_SECONDS: ${{ vars.REDIS_DEFAULT_TTL_SECONDS }}
      REDIS_POST_TTL_SECONDS: ${{ vars.REDIS_POST_TTL_SECONDS }}
      REDIS_USER_TTL_SECONDS: ${{ vars.REDIS_USER_TTL_SECONDS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      AWS_SES_SENDER_EMAIL: ${{ secrets.AWS_SES_SENDER_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required deploy settings
        run: |
          test -n "${EC2_HOST}" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "${EC2_USERNAME}" || (echo "Missing EC2_USERNAME secret" && exit 1)
          test -n "${EC2_SSH_KEY}" || (echo "Missing EC2_SSH_KEY secret" && exit 1)
          test -n "${DEPLOY_PATH}" || (echo "Missing DEPLOY_PATH variable" && exit 1)

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          NODE_ENV: ${{ env.NODE_ENV }}
          PORT: ${{ env.PORT }}
          CLIENT_URL: ${{ env.CLIENT_URL }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          FRONTEND_URLS: ${{ env.FRONTEND_URLS }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          DYNAMODB_USERS_TABLE: ${{ env.DYNAMODB_USERS_TABLE }}
          DYNAMODB_CONVERSATIONS_TABLE: ${{ env.DYNAMODB_CONVERSATIONS_TABLE }}
          DYNAMODB_MESSAGES_TABLE: ${{ env.DYNAMODB_MESSAGES_TABLE }}
          DYNAMODB_PARTICIPANTS_TABLE: ${{ env.DYNAMODB_PARTICIPANTS_TABLE }}
          DYNAMODB_CALL_SESSIONS_TABLE: ${{ env.DYNAMODB_CALL_SESSIONS_TABLE }}
          DYNAMODB_NOTIFICATION_TOKENS_TABLE: ${{ env.DYNAMODB_NOTIFICATION_TOKENS_TABLE }}
          DYNAMODB_POSTS_TABLE: ${{ env.DYNAMODB_POSTS_TABLE }}
          DYNAMODB_COMMENTS_TABLE: ${{ env.DYNAMODB_COMMENTS_TABLE }}
          DYNAMODB_URBAN_STATS_TABLE: ${{ env.DYNAMODB_URBAN_STATS_TABLE }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          JWT_EXPIRE: ${{ env.JWT_EXPIRE }}
          JWT_REFRESH_EXPIRE: ${{ env.JWT_REFRESH_EXPIRE }}
          AWS_SES_REGION: ${{ env.AWS_SES_REGION }}
          AWS_SES_SENDER_EMAIL: ${{ env.AWS_SES_SENDER_EMAIL }}
          AWS_S3_REGION: ${{ env.AWS_S3_REGION }}
          S3_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
          S3_AVATAR_FOLDER: ${{ env.S3_AVATAR_FOLDER }}
          S3_MESSAGE_FOLDER: ${{ env.S3_MESSAGE_FOLDER }}
          S3_POST_IMAGES_BUCKET: ${{ env.S3_POST_IMAGES_BUCKET }}
          S3_POST_IMAGES_FOLDER: ${{ env.S3_POST_IMAGES_FOLDER }}
          AWS_LOCATION_REGION: ${{ env.AWS_LOCATION_REGION }}
          AWS_LOCATION_STYLE: ${{ env.AWS_LOCATION_STYLE }}
          AWS_LOCATION_COLOR_SCHEME: ${{ env.AWS_LOCATION_COLOR_SCHEME }}
          AWS_LOCATION_VARIANT: ${{ env.AWS_LOCATION_VARIANT }}
          AWS_LOCATION_ALLOWED_IPS: ${{ env.AWS_LOCATION_ALLOWED_IPS }}
          AWS_CHIME_REGION: ${{ env.AWS_CHIME_REGION }}
          CHIME_MEETING_REGION: ${{ env.CHIME_MEETING_REGION }}
          CALL_RING_TIMEOUT_SECONDS: ${{ env.CALL_RING_TIMEOUT_SECONDS }}
          AI_PROVIDER: ${{ env.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ env.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_BEDROCK_REGION: ${{ env.AWS_BEDROCK_REGION }}
          AWS_BEDROCK_MODEL_ID: ${{ env.AWS_BEDROCK_MODEL_ID }}
          AWS_GEO_PLACES_REGION: ${{ env.AWS_GEO_PLACES_REGION }}
          AWS_GEO_ROUTES_REGION: ${{ env.AWS_GEO_ROUTES_REGION }}
          AWS_GEO_ROUTE_MODE: ${{ env.AWS_GEO_ROUTE_MODE }}
          AI_MAX_CONTEXT_POSTS: ${{ env.AI_MAX_CONTEXT_POSTS }}
          AI_DEFAULT_RADIUS_KM: ${{ env.AI_DEFAULT_RADIUS_KM }}
          AI_TIMEOUT_MS: ${{ env.AI_TIMEOUT_MS }}
          ASSISTANT_ROUTE_SAMPLE_METERS: ${{ env.ASSISTANT_ROUTE_SAMPLE_METERS }}
          ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS: ${{ env.ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS }}
          ASSISTANT_MEMORY_TTL_SECONDS: ${{ env.ASSISTANT_MEMORY_TTL_SECONDS }}
          ASSISTANT_MAX_TOOL_STEPS: ${{ env.ASSISTANT_MAX_TOOL_STEPS }}
          EMBEDDING_PROVIDER: ${{ env.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ env.EMBEDDING_MODEL }}
          OPENSEARCH_VECTOR_ENDPOINT: ${{ env.OPENSEARCH_VECTOR_ENDPOINT }}
          REDIS_URL: ${{ env.REDIS_URL }}
          REDIS_URL_DOCKER: ${{ env.REDIS_URL_DOCKER }}
          REDIS_ENABLED: ${{ env.REDIS_ENABLED }}
          REDIS_KEY_PREFIX: ${{ env.REDIS_KEY_PREFIX }}
          REDIS_CONNECT_TIMEOUT_MS: ${{ env.REDIS_CONNECT_TIMEOUT_MS }}
          REDIS_DEFAULT_TTL_SECONDS: ${{ env.REDIS_DEFAULT_TTL_SECONDS }}
          REDIS_POST_TTL_SECONDS: ${{ env.REDIS_POST_TTL_SECONDS }}
          REDIS_USER_TTL_SECONDS: ${{ env.REDIS_USER_TTL_SECONDS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          envs: GITHUB_REPOSITORY,GITHUB_REF_NAME,DEPLOY_PATH,NODE_ENV,PORT,CLIENT_URL,FRONTEND_URL,FRONTEND_URLS,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DYNAMODB_USERS_TABLE,DYNAMODB_CONVERSATIONS_TABLE,DYNAMODB_MESSAGES_TABLE,DYNAMODB_PARTICIPANTS_TABLE,DYNAMODB_CALL_SESSIONS_TABLE,DYNAMODB_NOTIFICATION_TOKENS_TABLE,DYNAMODB_POSTS_TABLE,DYNAMODB_COMMENTS_TABLE,DYNAMODB_URBAN_STATS_TABLE,JWT_SECRET,JWT_REFRESH_SECRET,JWT_EXPIRE,JWT_REFRESH_EXPIRE,AWS_SES_REGION,AWS_SES_SENDER_EMAIL,AWS_S3_REGION,S3_BUCKET_NAME,S3_AVATAR_FOLDER,S3_MESSAGE_FOLDER,S3_POST_IMAGES_BUCKET,S3_POST_IMAGES_FOLDER,AWS_LOCATION_REGION,AWS_LOCATION_STYLE,AWS_LOCATION_COLOR_SCHEME,AWS_LOCATION_VARIANT,AWS_LOCATION_ALLOWED_IPS,AWS_CHIME_REGION,CHIME_MEETING_REGION,CALL_RING_TIMEOUT_SECONDS,AI_PROVIDER,GEMINI_API_KEY,GEMINI_MODEL,AWS_BEARER_TOKEN_BEDROCK,AWS_BEDROCK_REGION,AWS_BEDROCK_MODEL_ID,AWS_GEO_PLACES_REGION,AWS_GEO_ROUTES_REGION,AWS_GEO_ROUTE_MODE,AI_MAX_CONTEXT_POSTS,AI_DEFAULT_RADIUS_KM,AI_TIMEOUT_MS,ASSISTANT_ROUTE_SAMPLE_METERS,ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS,ASSISTANT_MEMORY_TTL_SECONDS,ASSISTANT_MAX_TOOL_STEPS,EMBEDDING_PROVIDER,EMBEDDING_MODEL,OPENSEARCH_VECTOR_ENDPOINT,REDIS_URL,REDIS_URL_DOCKER,REDIS_ENABLED,REDIS_KEY_PREFIX,REDIS_CONNECT_TIMEOUT_MS,REDIS_DEFAULT_TTL_SECONDS,REDIS_POST_TTL_SECONDS,REDIS_USER_TTL_SECONDS
          script: |
            set -e

            REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
            REPO_DIR="${DEPLOY_PATH:-/home/${USER}/tixchat-backend}"
            BRANCH_NAME="${GITHUB_REF_NAME:-main}"

            mkdir -p "$(dirname "$REPO_DIR")"

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch --all --prune
            git checkout "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            cat > .env.production <<EOF
            NODE_ENV=${NODE_ENV:-production}
            PORT=${PORT:-5000}
            CLIENT_URL=${CLIENT_URL}
            FRONTEND_URL=${FRONTEND_URL}
            FRONTEND_URLS=${FRONTEND_URLS}
            AWS_REGION=${AWS_REGION}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            DYNAMODB_USERS_TABLE=${DYNAMODB_USERS_TABLE}
            DYNAMODB_CONVERSATIONS_TABLE=${DYNAMODB_CONVERSATIONS_TABLE}
            DYNAMODB_MESSAGES_TABLE=${DYNAMODB_MESSAGES_TABLE}
            DYNAMODB_PARTICIPANTS_TABLE=${DYNAMODB_PARTICIPANTS_TABLE}
            DYNAMODB_CALL_SESSIONS_TABLE=${DYNAMODB_CALL_SESSIONS_TABLE}
            DYNAMODB_NOTIFICATION_TOKENS_TABLE=${DYNAMODB_NOTIFICATION_TOKENS_TABLE}
            DYNAMODB_POSTS_TABLE=${DYNAMODB_POSTS_TABLE}
            DYNAMODB_COMMENTS_TABLE=${DYNAMODB_COMMENTS_TABLE}
            DYNAMODB_URBAN_STATS_TABLE=${DYNAMODB_URBAN_STATS_TABLE}
            JWT_SECRET=${JWT_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            JWT_EXPIRE=${JWT_EXPIRE:-7d}
            JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-30d}
            AWS_SES_REGION=${AWS_SES_REGION}
            AWS_SES_SENDER_EMAIL=${AWS_SES_SENDER_EMAIL}
            AWS_S3_REGION=${AWS_S3_REGION}
            S3_BUCKET_NAME=${S3_BUCKET_NAME}
            S3_AVATAR_FOLDER=${S3_AVATAR_FOLDER}
            S3_MESSAGE_FOLDER=${S3_MESSAGE_FOLDER}
            S3_POST_IMAGES_BUCKET=${S3_POST_IMAGES_BUCKET}
            S3_POST_IMAGES_FOLDER=${S3_POST_IMAGES_FOLDER}
            AWS_LOCATION_REGION=${AWS_LOCATION_REGION}
            AWS_LOCATION_STYLE=${AWS_LOCATION_STYLE}
            AWS_LOCATION_COLOR_SCHEME=${AWS_LOCATION_COLOR_SCHEME}
            AWS_LOCATION_VARIANT=${AWS_LOCATION_VARIANT}
            AWS_LOCATION_ALLOWED_IPS=${AWS_LOCATION_ALLOWED_IPS}
            AWS_CHIME_REGION=${AWS_CHIME_REGION}
            CHIME_MEETING_REGION=${CHIME_MEETING_REGION}
            CALL_RING_TIMEOUT_SECONDS=${CALL_RING_TIMEOUT_SECONDS}
            AI_PROVIDER=${AI_PROVIDER}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL}
            AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
            AWS_BEDROCK_REGION=${AWS_BEDROCK_REGION}
            AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID}
            AWS_GEO_PLACES_REGION=${AWS_GEO_PLACES_REGION}
            AWS_GEO_ROUTES_REGION=${AWS_GEO_ROUTES_REGION}
            AWS_GEO_ROUTE_MODE=${AWS_GEO_ROUTE_MODE}
            AI_MAX_CONTEXT_POSTS=${AI_MAX_CONTEXT_POSTS}
            AI_DEFAULT_RADIUS_KM=${AI_DEFAULT_RADIUS_KM}
            AI_TIMEOUT_MS=${AI_TIMEOUT_MS}
            ASSISTANT_ROUTE_SAMPLE_METERS=${ASSISTANT_ROUTE_SAMPLE_METERS}
            ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS=${ASSISTANT_ROUTE_INCIDENT_RADIUS_METERS}
            ASSISTANT_MEMORY_TTL_SECONDS=${ASSISTANT_MEMORY_TTL_SECONDS}
            ASSISTANT_MAX_TOOL_STEPS=${ASSISTANT_MAX_TOOL_STEPS}
            EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
            EMBEDDING_MODEL=${EMBEDDING_MODEL}
            OPENSEARCH_VECTOR_ENDPOINT=${OPENSEARCH_VECTOR_ENDPOINT}
            REDIS_URL=${REDIS_URL}
            REDIS_URL_DOCKER=${REDIS_URL_DOCKER}
            REDIS_ENABLED=${REDIS_ENABLED}
            REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX}
            REDIS_CONNECT_TIMEOUT_MS=${REDIS_CONNECT_TIMEOUT_MS}
            REDIS_DEFAULT_TTL_SECONDS=${REDIS_DEFAULT_TTL_SECONDS}
            REDIS_POST_TTL_SECONDS=${REDIS_POST_TTL_SECONDS}
            REDIS_USER_TTL_SECONDS=${REDIS_USER_TTL_SECONDS}
            EOF

            docker compose --env-file .env.production down --remove-orphans
            docker compose --env-file .env.production build --no-cache
            docker compose --env-file .env.production up -d

            sleep 8
            curl --fail --silent http://127.0.0.1:5000/health >/dev/null
            echo "Deployment completed successfully."
